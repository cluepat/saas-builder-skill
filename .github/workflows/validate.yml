name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate_package.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_download.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test stack prompt generation
        run: node --test tests/prompt-builder.test.mjs
      - name: Validate Claude Code packaging with its native CLI
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.316 plugin validate .claude-plugin/plugin.json
          npx --yes @anthropic-ai/claude-code@2.1.316 plugin validate .claude-plugin/marketplace.json
